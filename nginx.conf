server {
    listen 80;
    server_name your-domain.com;
    
    # Redirect semua HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # ─── SSL (Sesuaikan path sertifikat) ────────────────────────
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ─── Document Root ──────────────────────────────────────────
    root /var/www/tmj/public;
    index index.php;

    charset utf-8;

    # ─── Max Upload Size (untuk foto selfie absensi) ───────────
    client_max_body_size 10M;

    # ─── Security Headers ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Static Assets Caching ─────────────────────────────────
    location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── Laravel Routing ───────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── PHP-FPM ───────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Timeout untuk upload foto base64 yang besar
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
    }

    # ─── Block Akses ke File Sensitif ──────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ ^/(\.env|composer\.json|composer\.lock|package\.json) {
        deny all;
    }

    # ─── Disable Access Log untuk Favicon ──────────────────────
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ─── Error Pages ───────────────────────────────────────────
    error_page 404 /index.php;
}
